spring:
  application:
    name: faktura-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:faktura}
    username: ${DB_USER:faktura}
    password: ${DB_PASSWORD:faktura}
    hikari:
      maximum-pool-size: 10

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

faktura:
  cors:
    allowed-origins: ${FAKTURA_CORS_ORIGINS:http://localhost:5173}
