services:
  postgres:
    image: postgres:18
    container_name: faktura-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: faktura
      POSTGRES_USER: faktura
      POSTGRES_PASSWORD: faktura
    volumes:
      - faktura_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faktura -d faktura"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  faktura_postgres_data:
